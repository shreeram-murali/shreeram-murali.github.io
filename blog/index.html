  <script>
    /* Light/dark button. With no saved choice the site follows the system
       setting; picking the mode that matches the system clears the choice. */
    (function () {
      var root = document.documentElement;
      var button = document.getElementById("theme-toggle");
      var systemDark = window.matchMedia("(prefers-color-scheme: dark)");
      function current() { return root.dataset.theme || (systemDark.matches ? "dark" : "light"); }
      function sync() { button.setAttribute("aria-pressed", current() === "dark"); }
      button.addEventListener("click", function () {
        var next = current() === "dark" ? "light" : "dark";
        var system = systemDark.matches ? "dark" : "light";
        try {
          if (next === system) { delete root.dataset.theme; localStorage.removeItem("theme"); }
          else { root.dataset.theme = next; localStorage.setItem("theme", next); }
        } catch (e) { root.dataset.theme = next; }
        sync();
      });
      systemDark.addEventListener("change", sync);
      button.hidden = false;
      sync();
    })();
  </script>
